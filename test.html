<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Travel - Тест</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2a1f3f 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            background: linear-gradient(135deg, #00bfff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .flights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }
        .flight-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 191, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .flight-card:hover {
            border-color: rgba(0, 191, 255, 0.5);
            transform: translateY(-5px);
        }
        .flight-card h2 {
            color: #00bfff;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        .flight-card p {
            color: #b0b0ff;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .flight-details {
            display: grid;
            gap: 8px;
            margin: 15px 0;
            font-size: 0.9rem;
        }
        .detail { display: flex; justify-content: space-between; }
        .detail span:first-child { color: rgba(255, 255, 255, 0.7); }
        .price {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00bfff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
        }
        .btn {
            background: linear-gradient(135deg, #00bfff, #8a2be2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 191, 255, 0.4); }
        .status {
            text-align: center;
            padding: 20px;
            background: rgba(0, 191, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .error { color: #ff6b6b; }
        .loading { color: #00bfff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Cosmic Travel - Космические путешествия</h1>
        <div id="status" class="status loading">Загрузка рейсов...</div>
        <div id="flights" class="flights-grid"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function loadFlights() {
            try {
                const response = await fetch(`${API_URL}/flights`);
                if (!response.ok) throw new Error('Ошибка загрузки');

                const flights = await response.json();
                document.getElementById('status').innerHTML =
                    `✅ Загружено ${flights.length} космических направлений`;
                document.getElementById('status').className = 'status';

                const flightsHTML = flights.map(flight => `
                    <div class="flight-card">
                        <h2>${flight.destination}</h2>
                        <p>${flight.description}</p>
                        <div class="flight-details">
                            <div class="detail"><span>🚀 Корабль:</span><span>${flight.spacecraft}</span></div>
                            <div class="detail"><span>📅 Вылет:</span><span>${new Date(flight.departure_date).toLocaleDateString('ru-RU')}</span></div>
                            <div class="detail"><span>⏱️ Длительность:</span><span>${flight.duration_days} дней</span></div>
                            <div class="detail"><span>💺 Доступно мест:</span><span>${flight.available_seats}</span></div>
                        </div>
                        <div class="price">$${flight.price.toLocaleString('ru-RU')}</div>
                        <button class="btn" onclick="bookFlight(${flight.id}, '${flight.destination}')">
                            Забронировать
                        </button>
                    </div>
                `).join('');

                document.getElementById('flights').innerHTML = flightsHTML;
            } catch (error) {
                document.getElementById('status').innerHTML =
                    `❌ Ошибка: ${error.message}. Убедитесь что сервер запущен на порту 5000`;
                document.getElementById('status').className = 'status error';
            }
        }

        async function bookFlight(flightId, destination) {
            const name = prompt(`Бронирование: ${destination}\n\nВведите ваше имя:`);
            if (!name) return;

            const email = prompt('Введите ваш email:');
            if (!email) return;

            const phone = prompt('Введите телефон:');
            if (!phone) return;

            const passengers = prompt('Количество пассажиров:', '1');
            if (!passengers) return;

            try {
                const response = await fetch(`${API_URL}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        flight_id: flightId,
                        passenger_name: name,
                        passenger_email: email,
                        passenger_phone: phone,
                        num_passengers: parseInt(passengers)
                    })
                });

                if (!response.ok) throw new Error('Ошибка бронирования');

                const result = await response.json();
                alert(`✅ Бронирование создано!\n\nID: ${result.booking_id}\nСумма: $${result.total_price.toLocaleString('ru-RU')}`);
                loadFlights(); // Перезагрузить рейсы
            } catch (error) {
                alert(`❌ Ошибка: ${error.message}`);
            }
        }

        // Загрузить рейсы при загрузке страницы
        loadFlights();
    </script>
</body>
</html>
